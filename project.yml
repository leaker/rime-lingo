name: RimeLingo
options:
  bundleIdPrefix: io.github.leaker.rimelingo
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.12"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FKKCZM5CBJ
    CODE_SIGN_IDENTITY: "-"
    INFOPLIST_KEY_NSHumanReadableCopyright: "基于 RIME；发行包 GPL-3.0。"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: Apple Development
packages:
  RimeLingoKit:
    path: Packages/RimeLingoKit
targets:
  RimeLingo:
    type: application
    platform: macOS
    productName: RimeLingo
    sources:
      - path: Apps/RimeLingo
      - path: Apps/Shared
    dependencies:
      - package: RimeLingoKit
        product: RimeKit
      - package: RimeLingoKit
        product: RimeLingoCore
      - package: RimeLingoKit
        product: RimeLingoPanel
      - package: RimeLingoKit
        product: RimeLingoAI
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
    info:
      path: Apps/RimeLingo/Info.plist
      properties:
        CFBundleDisplayName: RimeLingo
        CFBundleName: RimeLingo
        NSHumanReadableCopyright: "基于 RIME；发行包 GPL-3.0。"
        LSUIElement: true
        LSBackgroundOnly: false
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        InputMethodConnectionName: io.github.leaker.inputmethod.rimelingo_Connection
        InputMethodServerControllerClass: RimeLingoInputController
        InputMethodServerDelegateClass: RimeLingoInputController
        tsInputMethodIconFileKey: RimeLingo.pdf
        tsInputMethodCharacterRepertoireKey: [Hans, Hant, Latn]
        TISInputSourceID: io.github.leaker.inputmethod.rimelingo
        TICapsLockLanguageSwitchCapable: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ComponentInputModeDict:
          tsInputModeListKey:
            io.github.leaker.inputmethod.rimelingo.hans:
              TISInputSourceID: io.github.leaker.inputmethod.rimelingo.hans
              TISIntendedLanguage: zh-Hans
              tsInputModeScriptKey: smUnicodeScript
              tsInputModeCharacterRepertoireKey: [Hans, Hant]
              tsInputModeKeyEquivalentModifiersKey: 4608
              tsInputModeMenuIconFileKey: RimeLingo.pdf
              tsInputModeAlternateMenuIconFileKey: RimeLingo.pdf
              tsInputModePaletteIconFileKey: RimeLingo.pdf
              tsInputModePrimaryInScriptKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeDefaultStateKey: true
          tsVisibleInputModeOrderedArrayKey: [io.github.leaker.inputmethod.rimelingo.hans]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leaker.inputmethod.rimelingo
        RIMELINGO_INFO_TEMPLATE: "$(SRCROOT)/Apps/RimeLingo/Info.plist"
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/RimeLingoInfo.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Apps/RimeLingo/RimeLingo.entitlements
    preBuildScripts:
      - name: Stamp build metadata
        script: bash "$SRCROOT/scripts/stamp-build-metadata.sh"
        inputFiles: ["$(RIMELINGO_INFO_TEMPLATE)"]
        outputFiles: ["$(DERIVED_FILE_DIR)/RimeLingoInfo.plist"]
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed librime plugins and SharedSupport
        script: bash "$SRCROOT/scripts/embed-runtime.sh"
        basedOnDependencyAnalysis: false
  RimeLingo Settings:
    type: application
    platform: macOS
    productName: RimeLingo Settings
    sources:
      - path: Apps/RimeLingoSettings
        excludes: [".impeccable"]
      - path: Apps/Shared
    dependencies:
      - package: RimeLingoKit
        product: RimeLingoCore
      - package: RimeLingoKit
        product: RimeLingoPanel
      - package: RimeLingoKit
        product: RimeLingoAI
    info:
      path: Apps/RimeLingoSettings/Info.plist
      properties:
        CFBundleDisplayName: RimeLingo Settings
        CFBundleName: RimeLingo Settings
        NSHumanReadableCopyright: "基于 RIME；发行包 GPL-3.0。"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # rimelingo-ime://theme?v=1&d=… links from vocabulary.example.com/themes (docs/themes.md).
        CFBundleURLTypes:
          - CFBundleURLName: io.github.leaker.rimelingo.theme
            CFBundleURLSchemes: [rimelingo-ime]
            CFBundleTypeRole: Viewer
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leaker.rimelingo.settings
        RIMELINGO_INFO_TEMPLATE: "$(SRCROOT)/Apps/RimeLingoSettings/Info.plist"
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/RimeLingoInfo.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/RimeLingoSettings/RimeLingoSettings.entitlements
    preBuildScripts:
      - name: Stamp build metadata
        script: bash "$SRCROOT/scripts/stamp-build-metadata.sh"
        inputFiles: ["$(RIMELINGO_INFO_TEMPLATE)"]
        outputFiles: ["$(DERIVED_FILE_DIR)/RimeLingoInfo.plist"]
        basedOnDependencyAnalysis: false
schemes:
  RimeLingo:
    build:
      targets:
        RimeLingo: all
        RimeLingo Settings: all
    run:
      config: Debug
  RimeLingo Settings:
    build:
      targets:
        RimeLingo Settings: all
    run:
      config: Debug
